<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – PRADEX</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div style="text-align:center;margin-bottom:1.25rem">
                <span class="logo-icon">P</span>
                <h1 style="margin-top:0.75rem">PRADEX Admin</h1>
                <p class="subtitle" style="margin-bottom:0">Sign in to manage your store</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required autocomplete="username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>
            <p style="text-align:center;margin-top:1.25rem;font-size:0.78rem;color:var(--text-dim)">
                Authorized staff only · PRADEX
            </p>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/staff.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        if (Auth.isAdminLoggedIn()) location.href = "dashboard.html";
        document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const btn = e.target.querySelector("button[type=submit]");
            btn.disabled = true;
            btn.textContent = "Signing in...";
            const res = await Auth.adminLogin(String(fd.get("username")||"").trim(), String(fd.get("password")||"").trim());
            if (res.success) {
                location.href = "dashboard.html";
            } else {
                if (typeof Utils !== "undefined") Utils.toast(res.message || "Invalid credentials", "error");
                else alert(res.message || "Invalid credentials");
                btn.disabled = false;
                btn.textContent = "Sign in";
            }
        });
    </script>
</body>
</html>
