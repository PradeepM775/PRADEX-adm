<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="images/favicon-180.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories – Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <aside class="admin-sidebar" id="sidebar">
        <div class="logo"><span class="logo-icon">PT</span><span>Admin</span></div>
        <nav class="admin-nav">
            <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="products.html"><span class="nav-icon">📦</span> Products</a>
            <a href="add-product.html"><span class="nav-icon">➕</span> Add Product</a>
            <a href="orders.html"><span class="nav-icon">🛒</span> Orders</a>
            <a href="inventory.html"><span class="nav-icon">📋</span> Inventory</a>
            <a href="purchasing.html"><span class="nav-icon">🧾</span> Purchasing</a>
            <a href="customers.html"><span class="nav-icon">👥</span> Customers</a>
            <a href="categories.html" class="active"><span class="nav-icon">🏷️</span> Categories</a>
            <a href="coupons.html"><span class="nav-icon">🎟</span> Coupons</a>
            <a href="reports.html"><span class="nav-icon">📈</span> Reports</a>
            <a href="finance.html"><span class="nav-icon">💳</span> Finance</a>
            <a href="settings.html"><span class="nav-icon">⚙️</span> Settings</a>
            <a href="#" onclick="Auth.adminLogout();location.href='login.html'"><span class="nav-icon">🚪</span> Logout</a>
        </nav>
    </aside>
    <div class="admin-main">
        <div class="admin-topbar">
            <button class="admin-sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <h2 style="font-size:1.1rem">Categories</h2>
            <button class="btn btn-primary btn-sm" onclick="showAdd()">+ Add Category</button>
        </div>
        <div class="admin-content">
            <div id="formBox" class="admin-form" style="display:none;margin-bottom:1.5rem;max-width:480px">
                <h3 id="formTitle" style="margin-bottom:1rem;font-size:1rem">Add Category</h3>
                <form id="catForm">
                    <input type="hidden" name="category_id" id="catId">
                    <div class="form-group"><label>Name *</label><input name="name" id="catName" class="form-control" required></div>
                    <div class="form-group"><label>Image URL</label><input name="image_url" id="catImg" class="form-control" placeholder="https://..."></div>
                    <div class="form-group"><label>Status</label>
                        <select name="status" id="catStatus" class="form-control">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('formBox').style.display='none'">Cancel</button>
                </form>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead><tr><th>Image</th><th>Name</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin-common.js"></script>
    <script>
        if (!Auth.isAdminLoggedIn()) location.href = "login.html";
        let editMode = false;

        async function load() {
            const res = await API.adminGetCategories();
            const list = res.success ? (res.data || []) : [];
            document.getElementById("tbody").innerHTML = list.length ? list.map(c => `
                <tr>
                    <td><img src="${c.image_url || ""}" alt="" onerror="this.style.opacity=0.2" style="width:40px;height:40px;object-fit:cover;border-radius:6px"></td>
                    <td>${c.name}</td>
                    <td><span class="status-badge status-${(c.status||'active')==='active'?'active':'cancelled'}">${c.status || "active"}</span></td>
                    <td style="display:flex;gap:0.35rem">
                        <button class="btn btn-sm btn-outline" onclick='editCat(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="delCat('${c.category_id}','${(c.name||'').replace(/'/g,'')}')">Delete</button>
                    </td>
                </tr>
            `).join("") : `<tr><td colspan="4" style="text-align:center">No categories</td></tr>`;
        }

        function showAdd() {
            editMode = false;
            document.getElementById("formTitle").textContent = "Add Category";
            document.getElementById("catId").value = "";
            document.getElementById("catName").value = "";
            document.getElementById("catImg").value = "";
            document.getElementById("catStatus").value = "active";
            document.getElementById("formBox").style.display = "block";
        }

        function editCat(c) {
            editMode = true;
            document.getElementById("formTitle").textContent = "Edit Category";
            document.getElementById("catId").value = c.category_id;
            document.getElementById("catName").value = c.name || "";
            document.getElementById("catImg").value = c.image_url || "";
            document.getElementById("catStatus").value = c.status || "active";
            document.getElementById("formBox").style.display = "block";
        }

        async function delCat(id, name) {
            if (!confirm("Delete category \"" + name + "\"?")) return;
            const res = await API.adminDeleteCategory(id);
            Utils.toast(res.success ? "Deleted" : res.message, res.success ? "success" : "error");
            if (res.success) load();
        }

        document.getElementById("catForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                category_id: document.getElementById("catId").value || ("cat-" + Date.now()),
                name: document.getElementById("catName").value.trim(),
                image_url: document.getElementById("catImg").value.trim(),
                status: document.getElementById("catStatus").value
            };
            const res = editMode
                ? await API.adminUpdateCategory(payload)
                : await API.adminAddCategory(payload);
            Utils.toast(res.success ? "Saved" : res.message, res.success ? "success" : "error");
            if (res.success) {
                document.getElementById("formBox").style.display = "none";
                load();
            }
        });

        load();
    </script>
</body>
</html>
